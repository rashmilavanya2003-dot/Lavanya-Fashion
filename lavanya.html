<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LunaWear | Online Clothing Store</title>

<style>

/* =========================
   GENERAL
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    color: #292329;
    background: #ffffff;
}

button,
input,
select,
textarea {
    font-family: inherit;
}

button {
    cursor: pointer;
}

a {
    text-decoration: none;
    color: inherit;
}


/* =========================
   HEADER
========================= */

header {
    position: sticky;
    top: 0;
    z-index: 100;

    display: flex;
    align-items: center;
    gap: 35px;

    padding: 18px 6%;

    background: white;
    border-bottom: 1px solid #eeeeee;
}

.logo {
    font-size: 28px;
    font-weight: bold;
}

.logo span {
    color: #c65379;
}

nav {
    display: flex;
    gap: 25px;
}

nav a {
    font-weight: 500;
}

nav a:hover {
    color: #c65379;
}

.header-right {
    margin-left: auto;

    display: flex;
    align-items: center;
    gap: 15px;
}

.search {
    display: flex;
    align-items: center;

    border: 1px solid #dddddd;
    border-radius: 25px;

    padding: 8px 14px;
}

.search input {
    border: none;
    outline: none;
    width: 180px;
}

.search button {
    border: none;
    background: none;
    font-size: 18px;
}

.cart-button {
    border: none;
    background: none;
    font-size: 21px;
}

.badge {
    background: #c65379;
    color: white;

    border-radius: 20px;
    padding: 3px 7px;

    font-size: 11px;
}


/* =========================
   HERO
========================= */

.hero {
    min-height: 570px;

    display: flex;
    align-items: center;

    padding: 70px 8%;

    background:
        linear-gradient(
            100deg,
            #f9e7ed,
            #ffffff
        );
}

.hero-content {
    max-width: 620px;
}

.eyebrow {
    color: #c65379;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 2px;
    margin-bottom: 15px;
}

.hero h1 {
    font-size: 68px;
    line-height: 1.05;
    margin-bottom: 20px;
}

.hero h1 span {
    color: #c65379;
}

.hero p {
    color: #6e676e;
    font-size: 18px;
    line-height: 1.7;
    margin-bottom: 25px;
}


/* =========================
   BUTTONS
========================= */

.btn {
    border: none;

    background: #292329;
    color: white;

    padding: 14px 24px;

    border-radius: 5px;

    font-weight: bold;
}

.btn:hover {
    opacity: 0.85;
}

.pink {
    background: #c65379;
}


/* =========================
   SECTIONS
========================= */

.section {
    padding: 70px 7%;
}

.section-title {
    display: flex;
    justify-content: space-between;
    align-items: end;

    margin-bottom: 30px;
}

.section-title h2 {
    font-size: 35px;
}


/* =========================
   CATEGORIES
========================= */

.categories {
    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 20px;
}

.category {
    padding: 55px 20px;

    text-align: center;

    background: #f7f0f3;

    border-radius: 8px;

    font-size: 23px;
    font-weight: bold;

    cursor: pointer;

    transition: 0.3s;
}

.category:hover {
    background: #ead8df;
    transform: translateY(-4px);
}


/* =========================
   PRODUCTS
========================= */

.products {
    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 22px;
}

.card {
    position: relative;

    overflow: hidden;

    background: white;

    border: 1px solid #eeeeee;

    border-radius: 7px;

    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);

    box-shadow:
        0 10px 30px rgba(0,0,0,0.08);
}

.card img {
    width: 100%;
    height: 290px;

    object-fit: cover;

    cursor: pointer;
}

.card-body {
    padding: 17px;
}

.card-body h3 {
    margin: 8px 0;
}

.category-label {
    color: #c65379;

    font-size: 11px;
    font-weight: bold;

    text-transform: uppercase;
}

.price {
    font-weight: bold;
    margin: 10px 0;
}

.old {
    color: #999;

    text-decoration: line-through;

    font-size: 13px;

    margin-left: 5px;
}

.small {
    padding: 10px 15px;
    font-size: 13px;
}

.heart {
    position: absolute;

    right: 12px;
    top: 12px;

    width: 38px;
    height: 38px;

    border: none;
    border-radius: 50%;

    background: white;

    font-size: 19px;

    z-index: 5;
}

.heart.active {
    color: #c65379;
}


/* =========================
   PROMOTION
========================= */

.promo {
    margin: 0 7% 70px;

    padding: 60px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    background: #292329;

    color: white;

    border-radius: 8px;
}

.promo p {
    color: #cccccc;
    margin-top: 10px;
}


/* =========================
   SHOP PAGE
========================= */

.shop-head {
    text-align: center;

    padding: 65px 20px;

    background: #f8f1f4;
}

.shop-head h1 {
    font-size: 45px;
    margin-bottom: 10px;
}

.shop-head p {
    color: #777;
}

.filters {
    display: flex;

    justify-content: center;

    flex-wrap: wrap;

    gap: 8px;

    margin: 30px 0;
}

.filter {
    border: 1px solid #ddd;

    background: white;

    padding: 10px 18px;

    border-radius: 25px;
}

.filter.active {
    background: #292329;
    color: white;
}


/* =========================
   MODAL
========================= */

.overlay {
    display: none;

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,0.55);

    z-index: 200;
}

.modal {
    display: none;

    position: fixed;

    z-index: 300;

    width: min(900px,92%);

    left: 50%;
    top: 50%;

    transform: translate(-50%,-50%);

    background: white;

    padding: 28px;

    border-radius: 8px;

    max-height: 90vh;

    overflow-y: auto;
}

.close {
    float: right;

    border: none;

    background: none;

    font-size: 28px;
}

.modal-grid {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 30px;
}

.modal img {
    width: 100%;
    height: 430px;

    object-fit: cover;
}

.modal-description {
    color: #777;

    line-height: 1.7;

    margin: 20px 0;
}

.modal select,
.modal input {
    width: 100%;

    padding: 12px;

    border: 1px solid #ddd;

    margin-top: 7px;
}


/* =========================
   CART
========================= */

.cart-drawer {
    display: none;

    position: fixed;

    right: 0;
    top: 0;

    z-index: 400;

    width: min(430px,100%);

    height: 100%;

    background: white;

    padding: 25px;

    overflow-y: auto;

    box-shadow:
        -5px 0 25px rgba(0,0,0,0.15);
}

.cart-head {
    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 20px;
}

.cart-item {
    display: grid;

    grid-template-columns:
        75px 1fr auto;

    gap: 12px;

    padding: 15px 0;

    border-bottom: 1px solid #eee;
}

.cart-item img {
    width: 75px;
    height: 90px;

    object-fit: cover;
}

.cart-item button {
    border: none;
    background: none;
}

.quantity button {
    border: 1px solid #ddd;

    background: white;

    padding: 2px 8px;
}

.cart-total {
    font-size: 21px;

    font-weight: bold;

    margin-top: 25px;
}


/* =========================
   CHECKOUT
========================= */

.checkout {
    max-width: 700px;

    margin: 60px auto;

    padding: 30px;
}

.checkout h1 {
    margin-bottom: 25px;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;

    font-weight: bold;

    margin-bottom: 7px;
}

.form-group input,
.form-group textarea {
    width: 100%;

    padding: 13px;

    border: 1px solid #ddd;

    border-radius: 5px;

    outline: none;
}

.success {
    text-align: center;

    padding: 70px;

    background: #f8f1f4;

    border-radius: 8px;
}


/* =========================
   FOOTER
========================= */

footer {
    background: #292329;

    color: white;

    padding: 55px 7%;

    display: grid;

    grid-template-columns:
        2fr 1fr 1fr;

    gap: 40px;
}

footer p,
footer a {
    color: #bbbbbb;

    margin: 10px 0;

    display: block;
}

.copy {
    text-align: center;

    background: #292329;

    color: #888;

    border-top: 1px solid #403a3f;

    padding: 18px;
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px) {

    nav {
        display: none;
    }

    .products {
        grid-template-columns:
            repeat(2,1fr);
    }

    .categories {
        grid-template-columns:
            repeat(2,1fr);
    }

    .hero h1 {
        font-size: 50px;
    }

}

@media(max-width:600px) {

    header {
        padding: 14px 4%;
    }

    .search {
        display: none;
    }

    .hero {
        min-height: 500px;
        padding: 50px 7%;
    }

    .hero h1 {
        font-size: 43px;
    }

    .products,
    .categories {
        grid-template-columns: 1fr;
    }

    .promo {
        display: block;
        margin: 0 5% 50px;
    }

    .promo .btn {
        margin-top: 20px;
    }

    .modal-grid {
        grid-template-columns: 1fr;
    }

    .modal img {
        height: 300px;
    }

    footer {
        grid-template-columns: 1fr;
    }

}

</style>
</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <a href="#" class="logo" onclick="showHome()">
        Luna<span>Wear</span>
    </a>

    <nav>

        <a href="#" onclick="showHome()">
            Home
        </a>

        <a href="#" onclick="showShop('All')">
            Shop
        </a>

        <a href="#" onclick="showShop('Women')">
            Women
        </a>

        <a href="#" onclick="showShop('Men')">
            Men
        </a>

    </nav>


    <div class="header-right">

        <div class="search">

            <input
                id="searchInput"
                type="text"
                placeholder="Search clothing..."
                onkeydown="searchKey(event)"
            >

            <button onclick="performSearch()">
                🔍
            </button>

        </div>


        <button
            class="cart-button"
            onclick="openCart()"
        >

            🛒

            <span
                class="badge"
                id="cartCount"
            >
                0
            </span>

        </button>

    </div>

</header>


<!-- =========================
     MAIN WEBSITE
========================= -->

<main id="app"></main>


<!-- =========================
     OVERLAY
========================= -->

<div
    class="overlay"
    id="overlay"
    onclick="closeEverything()">
</div>


<!-- =========================
     PRODUCT MODAL
========================= -->

<div
    class="modal"
    id="productModal">

    <button
        class="close"
        onclick="closeEverything()">
        ×
    </button>

    <div id="modalContent"></div>

</div>


<!-- =========================
     CART
========================= -->

<div
    class="cart-drawer"
    id="cartDrawer">

    <div class="cart-head">

        <h2>
            Your Cart
        </h2>

        <button
            class="close"
            onclick="closeCart()">
            ×
        </button>

    </div>


    <div id="cartItems"></div>


    <div
        class="cart-total"
        id="cartTotal">
    </div>


    <button
        class="btn pink"
        style="width:100%;margin-top:20px"
        onclick="checkout()">

        Proceed to Checkout

    </button>

</div>


<script>

/* =================================
   PRODUCT DATA
================================= */

const products = [

    {
        id: 1,
        name: "Rose Midi Dress",
        category: "Dresses",
        gender: "Women",
        price: 6500,
        oldPrice: 7600,

        image:
        "https://images.unsplash.com/photo-1515372039744-b8f02a3ae446?auto=format&fit=crop&w=800&q=80",

        description:
        "Elegant midi dress designed for casual days, dinners and special occasions."
    },


    {
        id: 2,
        name: "Classic White Shirt",
        category: "Tops",
        gender: "Women",
        price: 4200,
        oldPrice: 4900,

        image:
        "https://images.unsplash.com/photo-1603252110481-7ba873bf42ab?auto=format&fit=crop&w=800&q=80",

        description:
        "A clean and versatile shirt that works beautifully with jeans or trousers."
    },


    {
        id: 3,
        name: "Essential Black T-Shirt",
        category: "T-Shirts",
        gender: "Men",
        price: 2800,
        oldPrice: 3400,

        image:
        "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=800&q=80",

        description:
        "A comfortable everyday essential with a simple modern fit."
    },


    {
        id: 4,
        name: "Blue Straight Jeans",
        category: "Pants",
        gender: "Women",
        price: 5900,
        oldPrice: 6900,

        image:
        "https://images.unsplash.com/photo-1542272604-787c3835535d?auto=format&fit=crop&w=800&q=80",

        description:
        "Classic straight-leg denim made for everyday styling."
    },


    {
        id: 5,
        name: "Beige Summer Dress",
        category: "Dresses",
        gender: "Women",
        price: 6100,
        oldPrice: 7200,

        image:
        "https://images.unsplash.com/photo-1496747611176-843222e1e57c?auto=format&fit=crop&w=800&q=80",

        description:
        "Light and comfortable summer dress with a relaxed elegant look."
    },


    {
        id: 6,
        name: "Denim Jacket",
        category: "Jackets",
        gender: "Men",
        price: 7200,
        oldPrice: 8500,

        image:
        "https://images.unsplash.com/photo-1551028719-00167b16eac5?auto=format&fit=crop&w=800&q=80",

        description:
        "A timeless denim jacket for layering throughout the year."
    },


    {
        id: 7,
        name: "Minimal Knit Top",
        category: "Tops",
        gender: "Women",
        price: 3900,
        oldPrice: 4500,

        image:
        "https://images.unsplash.com/photo-1434389677669-e08b4cac3105?auto=format&fit=crop&w=800&q=80",

        description:
        "Soft minimal knit top with a relaxed silhouette."
    },


    {
        id: 8,
        name: "Relaxed Cargo Pants",
        category: "Pants",
        gender: "Men",
        price: 5500,
        oldPrice: 6400,

        image:
        "https://images.unsplash.com/photo-1517438476312-10d79c077509?auto=format&fit=crop&w=800&q=80",

        description:
        "Comfortable casual cargo pants with a practical modern design."
    }

];


/* =================================
   CART
================================= */

let cart =
    JSON.parse(
        localStorage.getItem("lunawearCart")
    ) || [];


/* =================================
   FORMAT MONEY
================================= */

function money(value) {

    return "LKR " +
        value.toLocaleString(
            "en-LK",
            {
                minimumFractionDigits: 2
            }
        );
}


/* =================================
   SAVE CART
================================= */

function saveCart() {

    localStorage.setItem(
        "lunawearCart",
        JSON.stringify(cart)
    );

    updateCartCount();
}


/* =================================
   UPDATE CART COUNT
================================= */

function updateCartCount() {

    const count =
        cart.reduce(
            (total, item) =>
                total + item.quantity,
            0
        );

    document.getElementById(
        "cartCount"
    ).textContent = count;
}


/* =================================
   PRODUCT CARD
================================= */

function productCard(product) {

    return `

        <div class="card">

            <button
                class="heart"
                onclick="toggleFavorite(event,this)">

                ♡

            </button>


            <img
                src="${product.image}"
                alt="${product.name}"
                onclick="openProduct(${product.id})"
            >


            <div class="card-body">

                <div class="category-label">
                    ${product.category}
                </div>


                <h3>
                    ${product.name}
                </h3>


                <div class="price">

                    ${money(product.price)}

                    <span class="old">
                        ${money(product.oldPrice)}
                    </span>

                </div>


                <button
                    class="btn small"
                    onclick="openProduct(${product.id})">

                    View Product

                </button>

            </div>

        </div>

    `;
}


/* =================================
   FOOTER
================================= */

function footer() {

    return `

        <footer>

            <div>

                <div class="logo">
                    Luna<span>Wear</span>
                </div>

                <p>
                    Everyday clothing
                    for your everyday style.
                </p>

            </div>


            <div>

                <h3>
                    Shop
                </h3>

                <a
                    href="#"
                    onclick="showShop('Women')">

                    Women

                </a>

                <a
                    href="#"
                    onclick="showShop('Men')">

                    Men

                </a>

                <a
                    href="#"
                    onclick="showShop('All')">

                    All Products

                </a>

            </div>


            <div>

                <h3>
                    Customer Help
                </h3>

                <p>
                    Delivery across Sri Lanka.
                </p>

                <p>
                    Cash on Delivery available.
                </p>

            </div>

        </footer>


        <div class="copy">

            © 2026 LunaWear.
            All rights reserved.

        </div>

    `;
}


/* =================================
   HOME PAGE
================================= */

function showHome() {

    document.getElementById("app").innerHTML = `

        <!-- HERO -->

        <section class="hero">

            <div class="hero-content">

                <div class="eyebrow">
                    NEW SEASON 2026
                </div>

                <h1>
                    Style that feels like
                    <span>you.</span>
                </h1>

                <p>
                    Discover modern clothing
                    for every day.
                    Carefully selected pieces
                    made to help you express
                    your own style.
                </p>

                <button
                    class="btn pink"
                    onclick="showShop('All')">

                    Shop Collection

                </button>

            </div>

        </section>


        <!-- CATEGORIES -->

        <section class="section">

            <div class="section-title">

                <div>

                    <div class="eyebrow">
                        SHOP BY CATEGORY
                    </div>

                    <h2>
                        Find your style
                    </h2>

                </div>

            </div>


            <div class="categories">


                <div
                    class="category"
                    onclick="showShop('Women')">

                    👗

                    <br>

                    Women

                </div>


                <div
                    class="category"
                    onclick="showShop('Men')">

                    👔

                    <br>

                    Men

                </div>


                <div
                    class="category"
                    onclick="showShop('Dresses')">

                    ✨

                    <br>

                    Dresses

                </div>


                <div
                    class="category"
                    onclick="showShop('T-Shirts')">

                    👕

                    <br>

                    T-Shirts

                </div>

            </div>

        </section>


        <!-- FEATURED -->

        <section class="section">

            <div class="section-title">

                <div>

                    <div class="eyebrow">
                        OUR PICKS
                    </div>

                    <h2>
                        Featured Products
                    </h2>

                </div>


                <a
                    href="#"
                    onclick="showShop('All')">

                    View All →

                </a>

            </div>


            <div class="products">

                ${products
                    .slice(0,4)
                    .map(productCard)
                    .join("")}

            </div>

        </section>


        <!-- PROMO -->

        <section class="promo">

            <div>

                <div class="eyebrow">
                    YOUR STYLE, YOUR WAY
                </div>

                <h2>
                    Simple pieces.
                    Better outfits.
                </h2>

                <p>
                    Quality clothing selected
                    for your everyday wardrobe.
                </p>

            </div>


            <button
                class="btn pink"
                onclick="showShop('All')">

                Explore Collection

            </button>

        </section>


        ${footer()}

    `;

    window.scrollTo(0,0);
}


/* =================================
   SHOP PAGE
================================= */

function showShop(
    filter = "All",
    search = ""
) {

    let list = products.filter(
        product => {

            const categoryMatch =
                filter === "All" ||
                product.category === filter ||
                product.gender === filter;

            const searchMatch =
                product.name
                    .toLowerCase()
                    .includes(
                        search.toLowerCase()
                    );

            return categoryMatch &&
                   searchMatch;
        }
    );


    document.getElementById("app").innerHTML = `

        <section class="shop-head">

            <div class="eyebrow">
                OUR COLLECTION
            </div>

            <h1>
                Shop Clothing
            </h1>

            <p>
                Find your next favourite outfit.
            </p>

        </section>


        <div class="filters">

            ${[
                "All",
                "Women",
                "Men",
                "Dresses",
                "Tops",
                "T-Shirts",
                "Pants"
            ]
            .map(category => `

                <button
                    class="filter ${
                        filter === category
                        ? "active"
                        : ""
                    }"
                    onclick="showShop('${category}')">

                    ${category}

                </button>

            `)
            .join("")}

        </div>


        <section class="section">

            ${
                list.length

                ?

                `<div class="products">

                    ${list
                        .map(productCard)
                        .join("")}

                </div>`

                :

                `<p style="
                    text-align:center;
                    padding:50px;
                ">

                    No products found.

                </p>`
            }

        </section>


        ${footer()}

    `;

    window.scrollTo(0,0);
}


/* =================================
   SEARCH
================================= */

function searchKey(event) {

    if(event.key === "Enter") {

        performSearch();

    }

}


function performSearch() {

    const search =
        document.getElementById(
            "searchInput"
        ).value;

    showShop(
        "All",
        search
    );
}


/* =================================
   PRODUCT DETAILS
================================= */

function openProduct(id) {

    const product =
        products.find(
            item => item.id === id
        );


    document.getElementById(
        "modalContent"
    ).innerHTML = `

        <div class="modal-grid">


            <img
                src="${product.image}"
                alt="${product.name}"
            >


            <div>

                <div class="eyebrow">
                    ${product.category}
                </div>


                <h1>
                    ${product.name}
                </h1>


                <div
                    class="price"
                    style="
                        font-size:24px;
                        margin:18px 0;
                    ">

                    ${money(product.price)}

                </div>


                <p class="modal-description">

                    ${product.description}

                </p>


                <label>
                    <b>
                        Select Size
                    </b>
                </label>


                <select id="size">

                    <option>XS</option>

                    <option>S</option>

                    <option selected>
                        M
                    </option>

                    <option>L</option>

                    <option>XL</option>

                    <option>XXL</option>

                </select>


                <br><br>


                <label>
                    <b>
                        Quantity
                    </b>
                </label>


                <input
                    id="quantity"
                    type="number"
                    min="1"
                    value="1"
                >


                <button
                    class="btn pink"
                    style="margin-top:20px"
                    onclick="addToCart(${product.id})">

                    Add to Cart

                </button>

            </div>

        </div>

    `;


    document.getElementById(
        "overlay"
    ).style.display = "block";


    document.getElementById(
        "productModal"
    ).style.display = "block";

}


/* =================================
   ADD TO CART
================================= */

function addToCart(id) {

    const size =
        document.getElementById(
            "size"
        ).value;


    const quantity =
        Number(
            document.getElementById(
                "quantity"
            ).value
        );


    const existing =
        cart.find(
            item =>
                item.id === id &&
                item.size === size
        );


    if(existing) {

        existing.quantity += quantity;

    }

    else {

        cart.push({

            id: id,

            size: size,

            quantity: quantity

        });

    }


    saveCart();

    closeEverything();

    openCart();

}


/* =================================
   OPEN CART
================================= */

function openCart() {

    renderCart();


    document.getElementById(
        "overlay"
    ).style.display = "block";


    document.getElementById(
        "cartDrawer"
    ).style.display = "block";

}


/* =================================
   CLOSE CART
================================= */

function closeCart() {

    document.getElementById(
        "cartDrawer"
    ).style.display = "none";


    document.getElementById(
        "overlay"
    ).style.display = "none";

}


/* =================================
   DISPLAY CART
================================= */

function renderCart() {

    const cartItems =
        document.getElementById(
            "cartItems"
        );


    if(cart.length === 0) {

        cartItems.innerHTML = `

            <p>
                Your cart is empty.
            </p>

        `;

        document.getElementById(
            "cartTotal"
        ).textContent = "";

        return;

    }


    let total = 0;


    cartItems.innerHTML =

        cart.map(
            (item,index) => {

                const product =
                    products.find(
                        p =>
                            p.id === item.id
                    );


                const subtotal =
                    product.price *
                    item.quantity;


                total += subtotal;


                return `

                    <div class="cart-item">


                        <img
                            src="${product.image}"
                            alt="${product.name}"
                        >


                        <div>

                            <b>
                                ${product.name}
                            </b>

                            <p>
                                Size:
                                ${item.size}
                            </p>

                            <p>
                                ${money(product.price)}
                            </p>


                            <div class="quantity">

                                <button
                                    onclick="changeQuantity(
                                        ${index},
                                        -1
                                    )">

                                    −

                                </button>


                                ${item.quantity}


                                <button
                                    onclick="changeQuantity(
                                        ${index},
                                        1
                                    )">

                                    +

                                </button>

                            </div>

                        </div>


                        <button
                            onclick="removeCart(${index})">

                            🗑️

                        </button>

                    </div>

                `;

            }
        ).join("");


    document.getElementById(
        "cartTotal"
    ).textContent =
        "Total: " +
        money(total);

}


/* =================================
   CHANGE QUANTITY
================================= */

function changeQuantity(
    index,
    change
) {

    cart[index].quantity += change;


    if(cart[index].quantity <= 0) {

        cart.splice(index,1);

    }


    saveCart();

    renderCart();

}


/* =================================
   REMOVE ITEM
================================= */

function removeCart(index) {

    cart.splice(index,1);

    saveCart();

    renderCart();

}


/* =================================
   CHECKOUT
================================= */

function checkout() {

    if(cart.length === 0) {

        alert(
            "Your shopping cart is empty."
        );

        return;

    }


    closeCart();


    document.getElementById(
        "app"
    ).innerHTML = `

        <section class="checkout">

            <div class="eyebrow">
                CHECKOUT
            </div>


            <h1>
                Complete Your Order
            </h1>


            <br>


            <div class="form-group">

                <label>
                    Full Name
                </label>

                <input
                    id="customerName"

                >

            </div>


            <div class="form-group">

                    Email
                </label>

/* =================================
   PLACE ORDER
================================= */

function placeOrder() {

    const name =
        document.getElementById(
            "customerName"
        ).value.trim();


    const email =
        document.getElementById(
            "customerEmail"
        ).value.trim();


    const phone =
        document.getElementById(
            "customerPhone"
        ).value.trim();


    const address =
        document.getElementById(
            "customerAddress"
        ).value.trim();


    if(
        !name ||
        !email ||
        !phone ||
        !address
    ) {

        alert(
            "Please fill in all fields."
        );

        return;

    }


    const orderNumber =
        "#LW" +
        Math.floor(
            10000 +
            Math.random() * 90000
        );


    cart = [];

    saveCart();


    document.getElementById(
        "app"
    ).innerHTML = `

        <section class="section">

            <div class="success">

                <div
                    style="
                        font-size:55px;
                    ">

                    ✓

                </div>


                <h1>
                    Order Placed Successfully!
                </h1>


                <p
                    style="
                        margin:15px 0;
                    ">

                    Thank you for shopping
                    with LunaWear.

                </p>


                <p>

                    Your order number is

                    <b>
                        ${orderNumber}
                    </b>

                </p>


                <br>


                <button
                    class="btn pink"
                    onclick="showHome()">

                    Continue Shopping

                </button>

            </div>

        </section>


        ${footer()}

    `;


    window.scrollTo(0,0);

}


/* =================================
   FAVORITE
================================= */

function toggleFavorite(
    event,
    button
) {

    event.stopPropagation();


    if(
        button.classList.contains(
            "active"
        )
    ) {

        button.classList.remove(
            "active"
        );

        button.textContent = "♡";

    }

    else {

        button.classList.add(
            "active"
        );

        button.textContent = "♥";

    }

}


/* =================================
   CLOSE EVERYTHING
================================= */

function closeEverything() {

    document.getElementById(
        "overlay"
    ).style.display = "none";


    document.getElementById(
        "productModal"
    ).style.display = "none";


    document.getElementById(
        "cartDrawer"
    ).style.display = "none";

}


/* =================================
   START WEBSITE
================================= */

updateCartCount();

showHome();

</script>
